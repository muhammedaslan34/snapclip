[package]
name = "snapclip"
version = "0.1.0"
edition = "2024"

[dependencies]
egui = "0.36"
egui-winit = { version = "0.36", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }
winit = "0.30"
tray-icon = "0.26"
global-hotkey = "0.8"
xcap = "0.9"
arboard = { version = "3.6", features = ["wayland-data-control"] }
clipboard-master = "4"
auto-launch = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tiny-skia = "0.12"
ab_glyph = "0.2"
rfd = "0.17"
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
epaint_default_fonts = "0.36"
anyhow = "1.0.104"
earcut = "0.4"
egui-wgpu = { version = "0.36.2", features = ["winit", "wayland", "x11"] }
pollster = "1.0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
embed-resource = "3"
