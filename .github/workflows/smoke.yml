name: smoke-test

# Runs snapclip.exe on a clean Windows machine and checks that its windows
# really appear, that copied text reaches the clipboard history, and that the
# global shortcut opens the clipboard panel. Trigger manually:
#   gh workflow run smoke.yml                     (build this commit)
#   gh workflow run smoke.yml -f tag=v0.1.0-beta.2  (test a release)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test (empty = build from this commit)
        required: false
        default: ""

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get the exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory app, out | Out-Null
          if ("${{ inputs.tag }}") {
            gh release download "${{ inputs.tag }}" -p "*.exe" -D app
          } else {
            cargo build --release
            Copy-Item target/release/snapclip.exe app/
          }

      - name: Run and observe
        shell: pwsh
        run: |
          Add-Type @"
          using System; using System.Text; using System.Collections.Generic;
          using System.Runtime.InteropServices;
          public static class W {
            delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc f, IntPtr l);
            [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll")] public static extern void keybd_event(byte vk, byte scan, uint flags, UIntPtr extra);
            public static List<string> List(uint pid) {
              var r = new List<string>();
              EnumWindows((h, l) => {
                uint p; GetWindowThreadProcessId(h, out p);
                var sb = new StringBuilder(256); GetWindowText(h, sb, 256);
                if (p == pid && sb.Length > 0 && sb.ToString().Contains("Clip") || p == pid && sb.ToString().StartsWith("SnapClip"))
                  r.Add((IsWindowVisible(h) ? "VISIBLE " : "hidden  ") + sb.ToString());
                return true;
              }, IntPtr.Zero);
              return r;
            }
          }
          "@
          function Windows($label) {
            Write-Host "--- windows: $label"
            [W]::List($app.Id) | ForEach-Object { Write-Host "    $_" }
          }
          $exe = (Get-ChildItem app/*.exe | Select-Object -First 1).FullName
          $log = "$env:LOCALAPPDATA\SnapClip\snapclip.log"
          $history = "$env:LOCALAPPDATA\SnapClip\history.json"

          Write-Host "=== start by hand (should show Settings) ==="
          $app = Start-Process $exe -PassThru
          Start-Sleep 8
          $app.Refresh(); Write-Host "running: $(-not $app.HasExited)"
          Windows "after start"

          Write-Host "=== copy text ==="
          Set-Clipboard -Value "smoke test clipboard text"
          Start-Sleep 3
          if (Test-Path $history) { Get-Content $history } else { Write-Host "NO history.json" }

          Write-Host "=== press Alt+Shift+V ==="
          [W]::keybd_event(0x12, 0, 0, [UIntPtr]::Zero)
          [W]::keybd_event(0x10, 0, 0, [UIntPtr]::Zero)
          [W]::keybd_event(0x56, 0, 0, [UIntPtr]::Zero)
          [W]::keybd_event(0x56, 0, 2, [UIntPtr]::Zero)
          [W]::keybd_event(0x10, 0, 2, [UIntPtr]::Zero)
          [W]::keybd_event(0x12, 0, 2, [UIntPtr]::Zero)
          Start-Sleep 4
          Windows "after Alt+Shift+V"

          Write-Host "=== second launch with --clipboard ==="
          Start-Process $exe -ArgumentList "--clipboard" -Wait
          Start-Sleep 4
          Windows "after --clipboard"

          Write-Host "=== second launch with --capture ==="
          Start-Process $exe -ArgumentList "--capture" -Wait
          Start-Sleep 5
          Windows "after --capture"

          $app.Refresh(); Write-Host "still running: $(-not $app.HasExited)"
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Write-Host "=== log ==="
          Get-Content $log -ErrorAction SilentlyContinue | Tee-Object -FilePath out/snapclip.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: out
